<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A live Hawaii itinerary for Waikīkī and Ko Olina.">
  <meta name="theme-color" content="#0c6f7d">
  <title>Hawaii Itinerary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="toggles.css">
  <link rel="stylesheet" href="timeline.css">
  <link rel="stylesheet" href="details.css">
  <link rel="stylesheet" href="arrow.css">
  <link rel="stylesheet" href="emoji-colors.css">
</head>
<body>
  <header class="hero">
    <div class="hero-sky" aria-hidden="true">
      <span class="hero-sun"></span>
      <span class="hero-sea"></span>
      <span class="hero-shimmer"></span>
    </div>
    <div class="hero-inner">
      <p class="brand" data-i18n="brand">Hawaii</p>
      <h1>Sep 2–8</h1>
      <p class="hero-place">Oʻahu · Waikīkī + Ko Olina</p>
      <ul class="hero-stats" id="hero-stats" hidden></ul>
    </div>
    <svg class="hero-wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <path d="M0 52c140-34 260-40 380-16s250 62 370 58 230-52 350-64 210 2 340 20v82H0z" fill="currentColor" opacity=".38"></path>
      <path d="M0 78c120-30 240-45 360-30s240 60 360 60 240-45 360-60 240-6 360 12v62H0z" fill="currentColor"></path>
    </svg>
  </header>
  <main>
    <div class="view-tabs" role="tablist" aria-label="Trip views">
      <button class="view-tab is-active" role="tab" aria-selected="true" aria-controls="itinerary-panel" data-view="itinerary" data-i18n="itinerary">Itinerary</button>
      <button class="view-tab" role="tab" aria-selected="false" aria-controls="food-panel" data-view="food" data-i18n="food">Things to eat</button>
    </div>
    <section class="view-panel" id="itinerary-panel" role="tabpanel">
      <div class="section-heading"><h2 data-i18n="plan">The island plan</h2></div>
      <div class="days" id="days" aria-live="polite"></div>
    </section>
    <section class="view-panel" id="food-panel" role="tabpanel" hidden>
      <div class="section-heading">
        <h2 data-i18n="food">Things to eat</h2>
        <div class="food-progress" id="food-progress" hidden>
          <p class="food-progress-label"></p>
          <div class="food-progress-track"><span class="food-progress-fill"></span></div>
        </div>
      </div>
      <div class="food-grid" id="food-list" aria-live="polite"></div>
    </section>
    <noscript><p class="error">JavaScript is required to load the trip data.</p></noscript>
  </main>
  <footer>
    <svg class="footer-wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <path d="M0 78c120-30 240-45 360-30s240 60 360 60 240-45 360-60 240-6 360 12v62H0z" fill="currentColor"></path>
    </svg>
    <span data-i18n="footer">Made for island days 🌺</span>
  </footer>
  <script src="app.js"></script>
  <script src="https://docs.google.com/spreadsheets/d/1-h-J9AFpZmi6FRT78hTkok_Q2pJ6WhjNqINpcXrZY_8/gviz/tq?tqx=responseHandler:loadItinerary&amp;sheet=Timeline&amp;range=A1:N200"></script>
  <script src="https://docs.google.com/spreadsheets/d/1-h-J9AFpZmi6FRT78hTkok_Q2pJ6WhjNqINpcXrZY_8/gviz/tq?tqx=responseHandler:loadFood&amp;sheet=Food&amp;range=A1:K100"></script>
</body>
</html>
